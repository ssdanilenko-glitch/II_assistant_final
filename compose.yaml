services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: it_assistant:dev
    container_name: it_assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://chat:${POSTGRES_PASSWORD:-chat}@postgres:5432/chat
      BOT_URL: http://bot:9000
      QDRANT_URL: http://qdrant:6333
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      HF_HUB_OFFLINE: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status == 200 else sys.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./app:/app/app
      - ./data/chats:/var/chats
      - ./data/rag-block-03:/app/data/rag-block-03
      - ./scripts:/app/scripts
      - ./docs:/app/docs
      - ./tests:/app/tests
      - ./data:/app/data
      - ./hf_cache:/home/appuser/.cache
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 6G

  redis:
    image: redis:7.4-alpine
    container_name: it-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: it_assistant-bot
    container_name: it-bot
    restart: unless-stopped
    volumes:
      - ./bot:/app/bot
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
    expose:
      - "9000"
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "-m", "bot"]
    healthcheck:
      test: [ "CMD", "python", "-c", "import sys; sys.exit(0)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16
    container_name: it-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: it-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Трейсинг RAG: UI + OTLP-приёмник на :6006. Спаны прилетают, только когда в
  # app выставлен PHOENIX_ENABLED=true (по умолчанию трейсинг выключен).
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: it-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/mnt/data

  ollama:
    image: ollama/ollama:latest
    container_name: it-ollama
    restart: unless-stopped
    ports:
       - "11435:11434"
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    deploy:
        resources:
          reservations:
            devices:
              - capabilities: [gpu]

volumes:
  redis_data:
  pg_data:
  qdrant_storage:
  phoenix_data:
  hf_cache:
  ollama_data:
