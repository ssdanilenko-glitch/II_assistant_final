[project]
name = "it_assistant"
version = "0.1.0"
description = "FastAPI-сервис для LLM: chat-история, стриминг, модерация, rate-limit, admin-API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] >=0.110",
    "pydantic >=2.6",
    "pydantic-settings >=2.2",
    "uvicorn[standard] >=0.29",
    "openai >=1.40",
    "redis >=5.0",
    "tenacity >=8.2",
    "aiofiles >=23",
    "sqlalchemy[asyncio] >=2.0",
    "asyncpg >=0.29",
    "alembic >=1.13",
    "tiktoken >=0.7",
    "structlog >=24",
    "aiogram >=3.10",
    "pypdf >=5.0",
    "python-docx >=1.1",
    "telegramify-markdown >=0.5",
    "qdrant-client >=1.14, <1.16",
    "tqdm >=4.66",
    "llama-index >=0.14.22",
    "llama-index-vector-stores-qdrant >=0.8.8",
    "llama-index-readers-file >=0.6.0",
    "llama-index-embeddings-huggingface",
    "llama-index-llms-ollama",
    "langgraph >=1.0, <2",
    "langchain >=1.0, <2",
    "langchain-openai >=1.0",
    "langgraph-checkpoint-sqlite >=2.1",
    "langgraph-checkpoint-postgres >=2.1",
    "aiosqlite >=0.20",
    "psycopg[binary,pool] >=3.2",
    "pytesseract",
    "pdf2image",
    "docling>=2.0.0",
    "aiosmtplib>=2.0.0",
    "faster-whisper >= 0.10.0",
    "httpx >= 0.27.0",
    "numpy",
    "docx2txt>=0.8",
]

[project.optional-dependencies]
tracing = [
    "openinference-instrumentation-llama-index>=3,<4",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community>=0.4",
    "anthropic>=0.40",
    "llama-index-llms-anthropic>=0.3",
    "pandas>=2",
    "arize-phoenix>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008", "BLE001", "S110", "E501",
    "RUF001", "RUF002", "RUF003",
    "DTZ005", "DTZ011",
    "PLR0912", "PLR0915", "TRY401",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*"    = ["E402", "F841", "RUF100", "B905"]
"tests/*"      = ["E402", "BLE001", "S110", "RUF100", "SIM118", "PIE810"]
"migrations/*" = ["E402", "BLE001"]