services:
  app:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/app/app:ro
    environment:
      LOG_LEVEL: DEBUG

  bot:
    volumes:
      - ./bot:/app/bot:ro
    environment:
      LOG_LEVEL: DEBUG

  redis:
    ports:
      - "6379:6379"
